<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Sign Up</title>
    <link rel="stylesheet" href="logincss.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <link href="../pic/logo2.png" sizes="32x16" rel="shortcut icon" />

    <style>
        /* Fix placeholder jadi putih */
        input::placeholder {
            color: white;
            opacity: 0.7;
        }
    </style>
</head>
<body>
    <div class="page-container">

        <!-- Header -->
        <header class="header">
            <nav>
                <a href="../index.php" class="brand">LokalKita</a>
                <ul>
                    <li><a href="../index.php">Homepage</a></li>
                    <li><a href="../login/login_type.php">Back</a></li>
                </ul>
            </nav>
        </header>

        <!-- Main -->
        <main>
            <div class="container">

                <!-- Right Box (Sign Up) -->
                <div class="right">
                    <h1>Start your journey</h1>

                    <!-- IMPORTANT: METHOD + ACTION FIXED -->
                    <form action="script/signup.php" method="POST">

                        <div class="form-group">
                            <input type="text" name="username" placeholder="Enter your name" required>
                        </div>

                        <div class="form-group">
                            <input type="email" name="reg_email" placeholder="Enter your email" required>
                        </div>

                        <div class="form-group" style="position: relative;">
                            <input type="password" name="password" id="password" placeholder="Enter your password" required>
                            <i class="fa-solid fa-eye" id="togglePassword"
                            style="font-size: 15px; position: absolute; margin-top:-6px; right:15px; top:50%; transform:translateY(-50%); cursor:pointer; color:white;"></i>
                        </div>

                        <button type="submit">Register</button>
                    </form>
                </div>

                <!-- Left Box (Login Redirect) -->
                <div class="left">
                    <h1>Already have an account?</h1>
                    <button><a href="user_login.html">Login</a></button>
                </div>

            </div>
        </main>
    </div>

     <script>    
                                document.getElementById("togglePassword").addEventListener("click", function () {
                                    const pwd = document.getElementById("password");
                                    if (pwd.type === "password") {
                                        pwd.type = "text";
                                        this.classList.remove("fa-eye");
                                        this.classList.add("fa-eye-slash");
                                    } else {
                                        pwd.type = "password";
                                        this.classList.remove("fa-eye-slash");
                                        this.classList.add("fa-eye");
                                    }
                                });
                        </script>
</body>
</html>
